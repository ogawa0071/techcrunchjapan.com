name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # typecheck (wrangler types + tsc), oxlint, oxfmt --check, vitest
      - run: bun run check
      - run: bun run build
